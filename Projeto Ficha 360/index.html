<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#8B3A3A" />
  <title>Ficha 360 do Cliente — Scont</title>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/ficha360.css" />
  <script src="../supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../portal-auth-guard.js"></script>
</head>
<body>
<div id="authOverlay" role="status">Verificando acesso…</div>
<a class="skip-link" href="#conteudo">Ir para o conteúdo</a>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <img src="https://scontdf.com.br/wp-content/uploads/2019/11/logo-scont-1024x363.png" alt="SCONT" width="96" height="34">
      <div>
        <h1>Ficha 360</h1>
        <p>Visão única do cliente</p>
      </div>
    </div>
    <nav class="menu" aria-label="Principal">
      <button class="menu-item" id="menuPainel" title="Painel da Carteira">
        <svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        <span>Painel da Carteira</span>
      </button>
    </nav>
    <div class="topbar-fim">
      <button class="btn-voltar" onclick="window.location.href='../portal.html'" title="Voltar ao Portal">
        <svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>
        <span>Voltar ao Portal</span>
      </button>
    </div>
  </header>

  <main class="main" id="conteudo" tabindex="-1">
    <div id="avisoFontes" class="aviso-fontes" role="status" hidden></div>
    <div id="carregando" class="carregando" role="status" hidden>Carregando carteira…</div>
    <section id="telaPainel" aria-label="Painel da Carteira" hidden></section>
    <section id="telaFicha" aria-label="Ficha da empresa" hidden></section>
  </main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="../Projeto RH/qsa-analise.js"></script>
<script src="../Projeto Onboarding Contabil/contabil-diario-util.js"></script>
<script src="js/vinculos.js"></script>
<script src="js/regras.js"></script>
<script src="js/carteira.js"></script>
<script src="js/fontes.js"></script>
<script src="js/app.js"></script>
<script src="js/painel.js"></script>
<script src="js/cadastro.js"></script>
<script src="js/anotacoes.js"></script>
<script src="js/ficha.js"></script>
</body>
</html>
