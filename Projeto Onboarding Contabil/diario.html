<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diário Contábil — Scont</title>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="../supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../portal-auth-guard.js"></script>
  <!-- jsPDF + AutoTable (Relatorios) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<!-- AUTH OVERLAY -->
<div id="authOverlay" style="position:fixed;inset:0;background:#F0F2F5;z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
  <div style="font-size:40px;">🔐</div>
  <p style="font-family:sans-serif;color:#8B3A3A;font-weight:600;font-size:15px;">Verificando acesso...</p>
</div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="https://scontdf.com.br/wp-content/uploads/2019/11/logo-scont-1024x363.png" alt="SCONT">
      <h1>Departamento Contábil</h1>
      <p>Diário Contábil</p>
    </div>

    <button class="sidebar-item" id="btnDashboard"><span class="sidebar-item-icon">📊</span> Visão Geral</button>
    <button class="sidebar-item" id="btnRelatorios"><span class="sidebar-item-icon">📄</span> Relatórios</button>
    <button class="sidebar-item" id="btnHistorico"><span class="sidebar-item-icon">🕒</span> Histórico</button>

    <div class="seletor-empresa-wrap" id="wrapBuscaEmpresa">
      <label for="buscaEmpresa">Empresa</label>
      <input type="text" id="buscaEmpresa" placeholder="Buscar empresa..." autocomplete="off">
      <div id="listaBuscaEmpresa" class="combobox-lista"></div>
    </div>

    <div class="sidebar-footer">
      <a href="migrar-diario-excel.html" style="display:block;text-align:center;color:rgba(255,255,255,.55);font-size:11px;margin-bottom:10px;text-decoration:none;">📥 Importar Excel Legado</a>
      <button class="btn-voltar" onclick="window.location.href='index.html'">
        🏠 <span>Central Contábil</span>
      </button>
    </div>
  </aside>

  <main class="main main-full" id="main">
    <div class="empty-state">
      <div class="emoji">📔</div>
      <h2>Diário Contábil</h2>
      <p>Selecione uma empresa no seletor ao lado, ou veja a Visão Geral da carteira.</p>
    </div>
  </main>
</div>

<script src="contabil-diario-util.js"></script>
<script src="diario.js"></script>
<script src="diario-relatorios.js"></script>
<script src="diario-historico.js"></script>
</body>
</html>
