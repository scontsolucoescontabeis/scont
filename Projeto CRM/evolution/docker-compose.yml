# Evolution API (canal WhatsApp via QR Code) - stack local para a fase de teste.
# Fase 2 (servidor do escritório): mesmo arquivo, trocando apenas SERVER_URL
# e expondo a porta 8080 atrás de um proxy HTTPS (Caddy) ou túnel nomeado.
#
#   cd "Projeto CRM/evolution"
#   docker compose up -d
#   docker compose logs -f evolution-api
#
services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      # --- Autenticação ---
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      # --- URL pública (preenchida pelo cloudflared na fase de teste) ---
      SERVER_URL: ${SERVER_URL}
      # --- Banco (persistência da sessão do WhatsApp) ---
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_scont
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      # --- Cache ---
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution_scont
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      # --- Webhook global desligado: cada instância recebe seu webhook
      #     via a Edge Function evolution-connect ---
      WEBHOOK_GLOBAL_ENABLED: "false"
      # --- Log enxuto ---
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: warn
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_pgdata:
  evolution_redis:
