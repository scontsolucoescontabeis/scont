<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Correção - SCONT</title>

    <script src="../supabase-config.js"></script>

    <style>
        :root {
            --primary-color: #8B3A3A;
            --primary-hover: #6B2A2A;
            --success-color: #388E3C;
            --danger-color: #D32F2F;
            --background-color: #F4F7F6;
            --card-bg: #FFFFFF;
            --text-primary: #2C3E50;
            --text-secondary: #7F8C8D;
            --border-color: #E0E6ED;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            max-width: 520px;
            width: 100%;
            padding: 40px 32px;
        }

        .card.centralizado { text-align: center; }

        .card img { height: 40px; margin-bottom: 24px; display: block; }
        .card.centralizado img { margin-left: auto; margin-right: auto; }

        .icon { font-size: 56px; margin-bottom: 16px; text-align: center; }

        h1 { font-size: 20px; margin-bottom: 8px; color: var(--text-primary); }

        p { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 8px;
        }
        textarea:focus { outline: none; border-color: var(--primary-color); }

        .erro-campo { font-size: 12px; color: var(--danger-color); margin-bottom: 12px; display: none; }

        button {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        .sucesso h1 { color: var(--success-color); }
        .erro h1 { color: var(--danger-color); }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(139, 58, 58, 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card centralizado" id="card">
        <img src="https://scontdf.com.br/wp-content/uploads/2019/11/logo-scont-1024x363.png" alt="Logo SCONT">
        <div class="spinner"></div>
        <h1>Carregando...</h1>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const tipo = params.get('tipo');
        const token = params.get('token');
        const card = document.getElementById('card');

        document.addEventListener('DOMContentLoaded', () => {
            if (!id || !tipo || !token) {
                mostrarErro('Link incompleto. Verifique se você abriu o link inteiro recebido por e-mail.');
                return;
            }
            mostrarFormulario();
        });

        function mostrarFormulario() {
            card.className = 'card';
            card.innerHTML = `
                <img src="https://scontdf.com.br/wp-content/uploads/2019/11/logo-scont-1024x363.png" alt="Logo SCONT">
                <h1>O que precisa ser corrigido?</h1>
                <p>Descreva com detalhes o que falta preencher ou qual documento/informação precisa ser ajustado. Nossa equipe vai analisar assim que você enviar.</p>
                <textarea id="motivo" placeholder="Ex: o endereço está desatualizado, falta o documento do sócio X..."></textarea>
                <p class="erro-campo" id="erroMotivo">Descreva o que precisa ser corrigido antes de enviar.</p>
                <button type="button" id="btnEnviar">Enviar</button>
            `;
            document.getElementById('btnEnviar').addEventListener('click', enviarRejeicao);
        }

        async function enviarRejeicao() {
            const textarea = document.getElementById('motivo');
            const erroEl = document.getElementById('erroMotivo');
            const motivo = textarea.value.trim();

            if (!motivo) {
                erroEl.style.display = 'block';
                textarea.focus();
                return;
            }
            erroEl.style.display = 'none';

            const btn = document.getElementById('btnEnviar');
            btn.disabled = true;
            btn.textContent = 'Enviando...';

            try {
                const resp = await fetch(`${window.SUPABASE_URL}/functions/v1/processar-validacao-formulario`, {
                    method:  'POST',
                    headers: {
                        'Content-Type':  'application/json',
                        'Authorization': `Bearer ${window.SUPABASE_KEY}`,
                        'apikey':        window.SUPABASE_KEY,
                    },
                    body: JSON.stringify({ id, tipo, token, acao: 'rejeitar', motivo }),
                });
                const json = await resp.json().catch(() => ({}));

                if (!resp.ok || json.ok === false) {
                    mostrarErro('Este link não é mais válido. Se ainda precisar validar ou corrigir informações, entre em contato com a Scont.');
                    return;
                }

                mostrarSucesso();
            } catch (err) {
                console.error(err);
                btn.disabled = false;
                btn.textContent = 'Enviar';
                erroEl.textContent = 'Não foi possível enviar agora. Tente novamente em alguns instantes.';
                erroEl.style.display = 'block';
            }
        }

        function mostrarSucesso() {
            card.className = 'card centralizado sucesso';
            card.innerHTML = `
                <img src="https://scontdf.com.br/wp-content/uploads/2019/11/logo-scont-1024x363.png" alt="Logo SCONT">
                <div class="icon">📨</div>
                <h1>Pendência registrada</h1>
                <p>Recebemos sua solicitação. Nossa equipe vai analisar e entrar em contato para os próximos passos.</p>
            `;
        }

        function mostrarErro(mensagem) {
            card.className = 'card centralizado erro';
            card.innerHTML = `
                <img src="https://scontdf.com.br/wp-content/uploads/2019/11/logo-scont-1024x363.png" alt="Logo SCONT">
                <div class="icon">⚠️</div>
                <h1>Link inválido ou expirado</h1>
                <p>${mensagem}</p>
            `;
        }
    </script>
</body>
</html>
