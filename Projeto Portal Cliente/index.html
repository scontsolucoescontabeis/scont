<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCONT - Portal do Cliente</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
    <link rel="stylesheet" href="../shared.css">
    <link rel="stylesheet" href="css/cliente.css">
    <script src="../supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="pagina-login">
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
        <img src="https://scontdf.com.br/wp-content/uploads/2019/11/logo-scont-1024x363.png" alt="SCONT">
        <p class="login-subtitulo">Portal do Cliente</p>
    </div>
    <div class="login-body">
        <div class="tabs">
            <button type="button" class="tab-btn active" data-tab="login">🔐 Login</button>
            <button type="button" class="tab-btn" data-tab="cadastro">📝 Cadastro</button>
        </div>

        <div id="login" class="tab-content active">
            <div id="alertLogin" class="alert" role="alert" aria-live="assertive"></div>
            <form id="loginForm">
                <div class="form-group"><label for="loginEmail">E-mail</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com" required autocomplete="email"></div>
                <div class="form-group"><label for="loginPassword">Senha</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password"></div>
                <button type="submit" class="btn-primary" id="btnLogin">Entrar</button>
            </form>
            <p class="link-linha"><button type="button" class="link-btn" id="btnEsqueci">Esqueci minha senha</button></p>
        </div>

        <div id="cadastro" class="tab-content">
            <div id="alertCadastro" class="alert" role="alert" aria-live="assertive"></div>
            <form id="cadastroForm">
                <div class="form-group"><label for="cadastroNome">Nome Completo *</label>
                    <input type="text" id="cadastroNome" placeholder="Seu nome completo" required autocomplete="name"></div>
                <div class="form-group"><label for="cadastroEmail">E-mail *</label>
                    <input type="email" id="cadastroEmail" placeholder="seu@email.com" required autocomplete="email"></div>
                <div class="form-group"><label for="cadastroPassword">Senha *</label>
                    <input type="password" id="cadastroPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password"></div>
                <div class="form-group"><label for="cadastroPasswordConfirm">Confirmar Senha *</label>
                    <input type="password" id="cadastroPasswordConfirm" placeholder="Confirme a senha" required minlength="6" autocomplete="new-password"></div>
                <div class="form-group"><label for="cadastroBusca">Sua Empresa *</label>
                    <input type="text" id="cadastroBusca" placeholder="Nome, código ou CNPJ da empresa" autocomplete="off" aria-describedby="buscaDica">
                    <p class="dica" id="buscaDica" aria-live="polite">Digite ao menos 4 letras ou o CNPJ</p>
                    <ul class="resultados" id="buscaResultados"></ul>
                    <div class="escolhida" id="empresaEscolhida" role="status" hidden></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label for="cadastroCargo">Cargo *</label>
                        <input type="text" id="cadastroCargo" placeholder="Seu cargo" required></div>
                    <div class="form-group"><label for="cadastroTelefone">Telefone</label>
                        <input type="tel" id="cadastroTelefone" placeholder="(61) 99999-9999" autocomplete="tel"></div>
                </div>
                <button type="submit" class="btn-primary" id="btnCadastro">Solicitar Acesso</button>
                <p class="nota-cadastro">ℹ️ Sua solicitação será analisada pela equipe SCONT.</p>
            </form>
        </div>
    </div>
    <div class="login-footer">© 2026 SCONT. Todos os direitos reservados.</div>
  </div>
</div>

<script src="js/estado.js"></script>
<script src="js/acesso.js"></script>
<script src="js/login.js"></script>
</body>
</html>
